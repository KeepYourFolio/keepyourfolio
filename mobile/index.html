    h+=regHead("Envoi par QR codes",esc(Dq.ttl||""))+`<div class="cd" style="align-items:center"><div id="qrimg" style="width:100%;max-width:300px;background:#fff;padding:12px;border-radius:14px;box-sizing:border-box"></div><b id="qrn" style="font-size:1.15rem">QR 1 / ${Dq.q.length}</b><p class="hint" style="margin:0;text-align:center">Présentez ces ${Dq.q.length} QR codes à la caméra de KYF sur ordinateur. L’ordre n’a pas d’importance : KYF les assemble et vérifie le tout.</p><div style="display:flex;gap:8px;width:100%"><button class="hb" id="qpv" style="flex:1">‹ Précédent</button><button class="hb" id="qnx3" style="flex:1">Suivant ›</button></div><button class="hb" id="qau" style="width:100%">${Dq.auto?"Arrêter le défilement":"Défilement automatique"}</button></div><p class="gl">Taille des QR codes</p><div class="seg" role="group" aria-label="Taille des QR codes">${[["s","Lisibles",nq("s")],["m","Équilibrés",nq("m")],["g","Compacts",nq("g")]].map(function(t){return `<button data-qsz="${t[0]}" aria-pressed="${(S.qsz||"m")===t[0]?"true":"false"}"><span>${t[1]}</span><b>${t[2]}</b></button>`}).join("")}</div><p class="hint" style="margin-top:6px">Le nombre indique combien de QR codes seront nécessaires. Choisissez « Lisibles » si la caméra a du mal à les lire.</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><button id="qcp">Copier le texte à la place</button>${Dq.fin==="paq"?'<button class="p" id="qfin">J’ai tout transmis</button>':""}</div>`;
  }else if(v==="qr_scan"){
    h+=regHead("Réception par QR codes","Depuis KYF sur ordinateur")+`<div class="cd" style="padding:10px"><video id="qv" muted playsinline style="width:100%;border-radius:14px;background:#000;aspect-ratio:1/1;object-fit:cover"></video><div style="height:6px;border-radius:3px;background:var(--line);overflow:hidden"><div id="qrb" style="height:100%;width:0;background:var(--acc);transition:width .2s"></div></div><p class="hint" id="qrm" style="margin:0">Visez les QR codes affichés par KYF sur l’ordinateur. Ils sont lus dans n’importe quel ordre.</p><div id="qrc" class="qrc"></div></div><div class="list"><label class="li" style="--k:var(--bl)"><span class="ic">${I.file}</span><span><b>Lire une photo ou une capture</b><small>Une ou plusieurs images de QR codes</small></span><input id="qrf" type="file" accept="image/*" multiple hidden></label></div><details class="cd"><summary>Coller le texte à la place</summary><textarea id="qrt" rows="3" autocomplete="off" aria-label="Texte du transfert"></textarea><button id="qrtb">Charger le texte collé</button></details>`;
  }else if(v==="reg_guide"){
    var GD=[
     ["1. Premiers pas", ["KYF Mobile est le compagnon de KYF sur ordinateur : vous y saisissez vos opérations au fil de l’eau, puis elles rejoignent KYF PC. Tout reste chiffré sur votre téléphone.", "À la première ouverture, choisissez une <b>phrase secrète</b> (deux saisies identiques). Elle chiffre votre coffre ; KYF ne la connaît pas et ne peut pas la récupérer. Notez-la en lieu sûr.", "Ensuite, l’écran <b>Votre coffre est prêt</b> propose deux départs. <b>J’utilise KYF sur ordinateur</b> : « Se connecter avec Google » récupère vos comptes, vos positions et la courbe. <b>Je commence ici</b> : trois questions rapides (votre prénom ou pseudo, seul ou en famille, premier compte à ouvrir), puis la saisie de votre première opération.", "L’appli se verrouille d’elle-même après le délai choisi (Réglages, Sécurité). Vous la rouvrez avec la phrase, ou avec l’empreinte / le visage / une clé d’accès si vous l’avez activé.", "Pour l’avoir comme une vraie appli : l’écran d’accueil vous propose de l’installer <b>avant de créer le coffre</b> (une appli installée garde ses données à part du navigateur). Sinon, installez-la sur l’écran d’accueil (Android : menu du navigateur, « Installer l’application » ; iPhone : Partager, « Sur l’écran d’accueil »)."]],
     ["2. Les écrans", ["Dans <b>Réglages, Affichage</b>, l’interrupteur « Nouvel accueil Patrimoine » choisit l’organisation. <b>Activé</b> : cinq entrées en bas : <b>Patrimoine</b>, <b>Comptes</b>, le bouton rond <b>+</b> au centre, <b>Opérations</b> (ou <b>Paquets</b>) et <b>Réglages</b>. <b>Désactivé</b> : l’accueil habituel (tuiles), <b>Relevés</b>, Paquets et Réglages.", "Le bouton <b>+</b> ouvre la saisie rapide (dicter, coller ou écrire l’opération). Depuis la fiche d’un compte, il ouvre directement une opération sur ce compte.", "L’onglet s’appelle <b>Opérations</b> quand l’envoi automatique est actif (compte Google relié), <b>Paquets</b> sinon. Il montre ce que vous avez saisi et où cela en est (chapitre 12).", "<b>Réglages</b> : Mon compte, Sécurité, Gestion, Frais de courtage, Liaison avec KYF PC, Sauvegarde du coffre, Corbeille, Affichage, aide et contact, soutien à KYF, informations sur l’application."]],
     ["3. Patrimoine : total, courbe et répartition", ["L’onglet <b>Patrimoine</b> montre une salutation avec votre nom, la valeur totale, la variation, la courbe, la répartition par compte (anneau) et vos lignes. Le menu « Tout le patrimoine » permet de choisir un seul compte ; touchez l’anneau pour ouvrir le détail des comptes, puis d’une ligne.", "<b>Courbe</b> : voir le chapitre 19. Touchez le gros montant pour passer de « hors espèces » à « espèces comprises ».", "<b>Pourquoi pas toutes les catégories ?</b> Le total du téléphone compte les placements dont KYF PC envoie la valeur : PEA, PEA-PME, CTO, assurance vie, PER, livrets, crypto, crowdfunding, SCPI en direct, PEE, or et métaux, autres actifs et liquidités (vos comptes courants, à ne pas confondre avec les espèces du PEA ou du CTO). L’immobilier reste suivi dans KYF PC : vous pouvez en saisir les opérations sur le téléphone, mais il n’est pas ajouté au total, qui peut donc être inférieur à celui du PC.","<b>Cours</b> : seuls les symboles des titres sont envoyés pour obtenir les cours du jour, jamais vos quantités ni vos montants. Livrets et assurance vie sont comptés à la dernière valeur connue.", "Tirez la page vers le bas pour actualiser (chapitre 17)."]],
     ["4. Comptes et accueil habituel", ["L’onglet <b>Comptes</b> liste vos comptes, un par ligne ; touchez-en un pour ouvrir sa fiche. La fiche a trois onglets : <b>Lignes</b> (vos positions), <b>Plans DCA</b> et <b>Opérations</b>. Pour PEA, CTO, assurance vie, PER et PEE, le tableau des lignes montre d’abord valeur, variation du jour et total ; faites-le glisser vers la gauche pour voir aussi la <b>quantité</b> et le <b>PRU</b> (prix de revient unitaire). Le bouton + y saisit directement une opération sur ce compte.", "Rubrique <b>Alimenter mon patrimoine</b> : « Je suis déjà sur KYF PC » / « Synchroniser avec KYF PC » (chapitre 13), « Scanner un QR code de KYF PC » (sans compte Google), « Saisie rapide », « Importer un relevé » (PDF ou capture d’écran de votre courtier) et « Mes positions actuelles » pour saisir ce que vous détenez déjà. Rubrique <b>Plans et autres actifs</b> : Plans DCA et tous les types d’actifs.", "<b>Accueil habituel</b> (si le nouvel accueil est désactivé) : en haut « Dicter, coller ou écrire », puis des tuiles rangées par groupe : <b>Bourse</b> (PEA, PEA-PME, CTO, DCA), <b>Épargne</b> (assurance vie, PER, livrets, PEE), <b>Quotidien</b> (budget, liquidités), <b>Autres actifs</b> (crypto, or et métaux, immobilier, crowdfunding, SCPI, autres actifs).", "Pour réorganiser l’accueil habituel : touchez le crayon, puis glissez une tuile dans son groupe, renommez-la ou masquez-la ; « Rétablir l’accueil par défaut » remet tout comme au départ."]],
     ["5. Saisir une opération pas à pas", ["Choisissez le compte (s’il y en a plusieurs), puis le type d’opération, puis les champs demandés : titre, date, quantité ou montant, frais. Un indicateur « Étape x sur y » et le bouton retour (flèche en haut à gauche, ou geste retour du téléphone) vous guident.", "Les montants se saisissent au pavé numérique intégré. Certains champs facultatifs (date, devise, frais…) sont dans « Plus d’options ».", "Un écran de confirmation récapitule l’opération avant l’enregistrement. Une opération enregistrée <b>compte tout de suite</b> sur le téléphone, puis part vers KYF PC (chapitre 12).", "Les frais de courtage peuvent être calculés automatiquement : voir Réglages, Frais de courtage (mode simple ou détaillé, 1er achat du mois, fonds gratuits)."]],
     ["6. PEA, PEA-PME et CTO", ["<b>Premier compte vide</b> : la page propose d’abord « Ajouter mes titres actuels » (quantité et prix de revient de ce que vous détenez déjà) ; Acheter et Vendre apparaissent dès qu’une ligne existe.", "<b>Acheter / Vendre</b> : cherchez le titre par son nom, son ticker ou son ISIN (la liste se met à jour dans Réglages, Gestion, « Titres »), puis quantité, prix et frais. <b>Dividende</b> : titre et montant perçu. <b>Versement / Retrait</b> : espèces ajoutées ou retirées du compte.", "Pour les espèces d’un PEA ou d’un CTO, utilisez toujours Versement ou Retrait dans ce compte. Les comptes courants se saisissent à part, dans Liquidités (chapitre 11)."]],
     ["7. Assurance vie, PER et PEE", ["<b>Assurance vie et PER</b> : choisissez le contrat. Opérations : <b>versement</b>, <b>versement programmé</b>, <b>rachat</b> ; <b>arbitrage</b> et <b>frais</b> ; <b>valeur du contrat</b>, <b>valeur d’une ligne</b> et <b>nouvelle ligne manuelle</b> ; et « Rendement SCPI reçu » pour la distribution d’une SCPI ou SCI logée dans le contrat.", "<b>Arbitrage</b> : ligne source, montant (en € ou en % de la ligne), puis ligne de destination, avec la quantité reçue et le prix si vous les connaissez. Les lignes connues du contrat (récupérées depuis KYF PC) sont proposées en liste.", "<b>PEE</b> (épargne salariale) : <b>versement</b> (avec l’abondement de l’employeur, facultatif) et <b>retrait</b>. Vos plans connus dans KYF sont proposés en liste."]],
     ["8. Livrets", ["<b>Dépôt, retrait, intérêts</b> et <b>virement entre livrets</b>. Avec plusieurs livrets, vous choisissez d’abord lequel ; sinon l’appli passe directement à l’opération. Un livret absent de la liste se saisit par son nom.", "Un virement entre livrets est enregistré comme un retrait sur l’un et un dépôt sur l’autre. Un <b>versement programmé</b> sur livret peut aussi être saisi."]],
     ["9. Crypto et stablecoins", ["Opérations : <b>achat</b>, <b>vente</b>, <b>swap</b> (échange), <b>transfert</b> et <b>frais</b>. Les cryptos courantes sont proposées avec leur logo et vous pouvez en ajouter d’autres.", "Les <b>stablecoins</b> (USDC, USDT…) sont gérés comme sur KYF PC : un achat, un swap ou un transfert met à jour les deux côtés, et ils comptent dans votre total.", "Vos plans DCA crypto de KYF apparaissent aussi dans ce compte."]],
     ["10. SCPI", ["Opérations : <b>achat</b> et <b>vente</b> de parts, <b>dividende</b>, <b>mise à jour</b> (prix ou taux). Indiquez la <b>détention</b> : en direct, via une assurance vie, un PER ou une SCI ; une nue-propriété est possible (durée).", "Vos SCPI connues dans KYF sont listées : touchez-en une pour saisir un dividende, ou le bouton rond pour mettre à jour son prix."]],
     ["11. Or, immobilier, crowdfunding, budget, liquidités, autres actifs et DCA", ["<b>Or et métaux</b> : achat et vente d’or, argent, platine ou palladium (produit, quantité, poids, montant). Une fois un achat enregistré, la rubrique Or &amp; métaux apparaît dans Comptes.", "<b>Immobilier</b> : <b>valeur d’un bien</b> (valeur estimée) et <b>loyer d’un bien</b> (loyer mensuel).", "<b>Crowdfunding</b> : nouveau projet (plateforme, montant investi, taux annuel, durée, dates) et mise à jour d’un projet.", "<b>Budget</b> : flux récurrents (salaire, abonnements…) avec libellé, catégorie, montant, et le sens : entrée ou sortie d’argent.", "<b>Liquidités</b> : solde d’un compte courant. <b>Autres actifs</b> : véhicule, montre, art, vin, bijou… : créez l’actif puis mettez sa valeur à jour quand elle change.", "<b>Plans DCA</b> : créez un plan (ETF, montant, fréquence) ; quand un achat programmé est dû, il est proposé « à saisir » et se valide en un geste."]],
     ["12. Opérations : de l’appli à KYF PC", ["Une opération saisie <b>compte tout de suite sur le téléphone</b> : positions, espèces et total sont recalculés sans attendre le PC. KYF PC reste la référence de votre patrimoine ; le téléphone saisit et consulte.", "<b>Envoi automatique</b> (compte Google relié, activé par défaut) : chaque opération validée part seule vers votre classeur Google « KYF - Keep Your Folio » (onglet KYF_Mobile_Ops) dès que le réseau le permet, avec nouvel essai chaque minute en cas d’échec. <b>KYF PC lit ces opérations à son lancement</b> et les applique. Le téléphone affiche ensuite le résultat : <b>envoyée</b>, <b>à valider sur KYF PC</b> (en attente de votre confirmation côté PC), <b>intégrée dans KYF PC</b>, <b>ignorée</b>, <b>refusée</b> ou <b>déjà présente</b> (doublon). L’interrupteur se trouve dans l’onglet Opérations ; un lien en bas de la liste permet de revenir au mode manuel.", "<b>Envoi manuel</b> (sans compte Google, ou envoi automatique désactivé) : trois onglets, <b>À envoyer</b>, <b>Envoyées</b> et <b>Enregistrées</b>. Envoyez par QR codes (présentés à la caméra de KYF PC, dans n’importe quel ordre), « Copier le texte » ou « Partager le fichier ». Une fois importé, KYF PC génère un <b>reçu</b> : chargez-le (fichier .kyfrecu, texte collé ou QR codes) pour que les opérations passent en « Envoyées ».", "Une opération se modifie ou se supprime depuis sa fiche. Une opération déjà envoyée puis modifiée repart avec la mention « remplace ». « Annuler » restaure une suppression, et la Corbeille garde 30 jours.", "Après l’intégration par le PC, touchez « Synchroniser avec KYF PC » (onglet Comptes) pour que le téléphone reprenne le patrimoine à jour."]],
     ["13. Liaison avec KYF PC", ["KYF sur ordinateur s’ouvre dans le navigateur, à l’adresse <b>keepyourfolio.fr</b> (Réglages, Liaison avec KYF PC, « Comment ça marche ? » permet de la copier ou de l’envoyer).", "<b>Google (recommandé)</b> : touchez « Je suis déjà sur KYF PC » (onglet Comptes) ou « Se connecter avec Google » (Réglages, Liaison avec KYF PC). C’est le même geste : vous vous connectez à Google et l’appli récupère aussitôt vos comptes, positions et historique. Ensuite, « Synchroniser avec KYF PC » (onglet Comptes) remet tout à jour à tout moment. <b>GitHub</b> (jeton et mot de passe) et <b>WebDAV</b> sont d’autres canaux, qui ne reprennent que les noms.", "La liaison copie de KYF PC vers le téléphone ; elle ne modifie jamais le PC. Les opérations saisies sur le téléphone, elles, remontent au PC par le chapitre 12.", "<b>Avec Google</b> : sont repris vos comptes (PEA, CTO, assurances vie, PER, livrets…), leurs positions et quantités, les espèces, les cryptos et stablecoins, les valeurs de contrats et l’<b>historique</b> (une séance enregistrée par KYF PC chaque jour). À l’ouverture, l’appli se resynchronise si la dernière synchronisation date de plus de 15 minutes.", "<b>Par QR codes ou texte collé</b> (sans Google) : seuls les noms (comptes, titres, personnes, biens) sont conservés, jamais les montants. « Données reçues de KYF » montre ce qui a été gardé.", "Le total du téléphone peut différer de quelques dizaines d’euros de celui du PC : le téléphone utilise les cours du moment. À la connexion Google, votre prénom est repris dans « Mon compte » s’il est vide."]],
     ["14. Gestion, famille et comptes", ["Réglages, <b>Gestion</b> : la liste de titres (mise à jour, QR code ou texte collé), « Mes comptes » (plusieurs PEA, CTO, assurances vie…), « Famille » pour rattacher les opérations à vous, votre conjoint, vos enfants… (à l’installation, l’étape « Qui suivez-vous ? » l’active ou non ; vous pouvez la changer ici à tout moment), et l’interrupteur de la saisie vocale."]],
     ["15. Sauvegarde et changement de téléphone", ["Le coffre vit uniquement sur ce téléphone : réinstaller l’appli ou effacer les données du navigateur le supprime.", "Réglages, <b>Sauvegarde du coffre</b> : exportez un fichier chiffré .kyfmobile (seule votre phrase l’ouvre), enregistré dans Téléchargements ou partagé. Sur le nouveau téléphone, installez l’appli puis « Restaurer une sauvegarde » sur l’écran de création.", "Réglages, <b>Corbeille</b> : les opérations et les comptes supprimés y restent 30 jours ; touchez-en un pour le restaurer. Pour supprimer un compte (par exemple un test, ou un compte qui n’est plus à jour) : ouvrez-le dans Comptes puis « Supprimer ce compte », ou Réglages, Gestion, icône corbeille. Un compte venu de KYF PC revient à la synchronisation tant qu’il existe là-bas."]],
     ["16. Sécurité", ["Réglages, Sécurité : afficher la phrase secrète (20 secondes), la changer (le coffre est re-chiffré), activer l’empreinte / le visage / une clé d’accès, verrouiller maintenant, et choisir le verrouillage automatique (1, 2, 5 ou 15 minutes).", "« Rester déverrouillé à l’actualisation » évite de ressaisir la phrase quand la page se recharge pendant ce délai.","<b>Phrase oubliée</b> : personne ne peut la récupérer. Sur l’écran de verrouillage, « Phrase oubliée ? » efface le coffre de ce téléphone. Créez ensuite une nouvelle phrase, puis touchez « Je suis déjà sur KYF PC » (Comptes) : vos comptes, positions et courbe reviennent depuis KYF PC. Seules les opérations pas encore envoyées sont perdues (avec l’envoi automatique, presque aucune)."]],
     ["17. Affichage et mise à jour", ["Réglages, Affichage : thème clair, sombre ou automatique, choix de l’accueil (Nouvel accueil Patrimoine) ; logos en ligne (désactivés : pastilles colorées, sans réseau).", "<b>Mise à jour</b> : tirez la page vers le bas depuis le haut de l’écran, relâchez : l’appli cherche la dernière version. Pour qu’elle s’applique, fermez complètement l’appli puis rouvrez-la (parfois deux ouvertures).", "Réglages, Application : mode hors ligne (import PDF et lecture de captures sans réseau, environ 10 Mo à télécharger), version, contact.", "Gestes : glissez un menu du bas vers le bas pour le fermer ; le geste retour du téléphone revient à l’écran précédent."]],
     ["18. Confidentialité, aide et contact", ["Vos données ne quittent pas le téléphone. Le réseau n’est utilisé que pour le contact, la liste de titres, la liaison avec KYF PC, les cours (symboles seulement), les logos, la dictée (navigateur) et, si vous les activez, les statistiques anonymes.", "Une question ? Réglages, Questions fréquentes. Un bug ou une idée ? Réglages, Application, Contact. KYF est gratuit : « Soutenir KYF » (Ko-fi ou USDC) est facultatif. Un petit message de remerciement apparaît à la 5e ouverture, puis une fois par mois à la même date : « Plus tard » le ferme sans rien ouvrir."]],
     ["19. La courbe : hors espèces ou espèces comprises", ["<b>Ce que montre la courbe</b> : la valeur de votre patrimoine jour après jour. Les jours passés viennent des séances enregistrées par KYF PC ; le dernier point est le total du jour, calculé avec les cours du moment.", "<b>Hors espèces</b> : tous vos placements (ETF, actions, crypto, assurance vie, PER, livrets, biens…), sans les espèces des comptes (PEA, CTO). C’est la vue pour suivre la performance des marchés : un versement ou un retrait d’espèces ne la fait pas bouger.", "<b>Espèces comprises</b> : le même total plus les espèces, c’est-à-dire le patrimoine complet.", "<b>Pour changer de vue</b> : touchez le gros montant. Le montant, la courbe et la variation (« Depuis le … ») suivent votre choix, comme sur KYF PC. Le choix est mémorisé.", "<b>Pourquoi « espèces comprises » démarre plus tard</b> : KYF PC n’enregistre les espèces de chaque séance que depuis une certaine date. Avant, on ne sait pas combien d’espèces vous aviez. « Hors espèces » remonte jusqu’à la première séance.", "Posez le doigt sur la courbe pour voir le montant et la date du jour touché. Périodes : 1M, 3M, 1A, Tout."]],
     ["20. Mon compte et salutation", ["<b>Mon compte</b> (Réglages) : le nom affiché dans l’appli, modifiable. Il apparaît dans la salutation en haut de Patrimoine : Bonjour, Bonne soirée, Bonne nuit, Bonne année (1er au 15 janvier), Joyeux Noël (24 et 25 décembre), avec un petit pictogramme qui change selon l’heure. Sur téléphone un nom trop long est coupé ; sur tablette il s’affiche en entier."]],
     ["21. Saisie rapide, dictée et relevés", ["<b>Saisie rapide</b> (bouton + ou « Dicter, coller ou écrire ») : dictez, collez un message / e-mail de confirmation, ou écrivez une phrase comme « j’ai acheté 3 CW8 à 112 euros » ; l’appli prépare l’opération, vérifiez avant d’enregistrer. Elle sait aussi <b>créer un compte</b> : « ajoute un PEA Fortuneo ouvert le 12 mars 2021 avec 500 euros », « crée une assurance vie Linxea avec 1000 euros » (nom, date d’ouverture et versement initial, sans plus de détails).", "La dictée est faite par votre navigateur (appli en https) ; à défaut, utilisez le micro de votre clavier. Elle peut être désactivée dans Gestion.", "<b>Importer un relevé</b> : choisissez un PDF ou une capture d’écran de votre courtier ; la lecture est faite sur le téléphone. Vérifiez toujours le résultat."]],
     ["22. Analyses", ["Dans <b>Comptes</b>, la rubrique <b>Analyses</b> réunit des pages de lecture : elles se nourrissent de ce que KYF PC envoie (Google, fichier ou QR code). Sans liaison, certaines restent vides ou se limitent à ce que vous avez saisi ici. Les réglages et les données se créent dans KYF PC ; le téléphone consulte.", "<b>Dividendes</b> : versements reçus par année, mois par mois. <b>Fiscalité</b> : impôt estimé si vous retiriez de l’argent d’un PEA ou d’un CTO (curseur du montant, avant ou après 5 ans pour le PEA). <b>Bilan annuel</b> : ce qui s’est passé sur l’année.", "<b>Alertes</b> : les alertes déclenchées sur KYF PC (30 derniers jours), vos objectifs de cours et, via la roue des paramètres, les seuils. <b>Performances</b> : variation mois par mois (touchez un mois pour le détail, flèches pour changer d’année). <b>Séances</b> et <b>Journal des séances</b> : jour par jour, avec les jours fériés et les week-ends crypto.", "<b>Zones géographiques</b> : répartition sur un globe qui tourne, touchez une zone pour le détail. <b>Budget</b> : revenus et dépenses récurrents, calculés comme sur KYF PC. <b>Mes projets</b> : l’avancement de vos projets (retraite, maison, études…) en anneaux ; touchez-en un pour voir ses lignes, le modifier ou le supprimer. <b>Nouveau projet</b> : nom, objectif facultatif, couleur, puis choix des lignes ; le projet rejoint KYF PC avec l’envoi des opérations (à valider sur le PC), ou reste sur le téléphone si vous refusez l’enregistrement sur KYF PC. Seules les lignes suivies sur mobile (ETF, actions, crypto) comptent.", "<b>Or &amp; métaux</b> n’est plus dans Analyses : la page se trouve dans <b>Comptes</b>, sous vos comptes, et n’apparaît que si vous avez au moins un métal (saisi ici ou reçu de KYF PC). Elle montre la valeur de vos pièces et lingots au cours du jour, la plus-value, le nombre de positions et le métal dominant. Les cours viennent de KYF PC ; sans eux, la page affiche les prix d’achat. Un achat d’or saisi sur le téléphone s’ajoute à la liste (« saisi ici »).", "Si l’historique de KYF PC n’est pas arrivé, Performances et Séances sont calculés sur ce téléphone, sur l’ensemble du patrimoine : une note le précise."]]
    ];
    h+=regHead("Guide d’utilisation","Réglages")+`<p class="hint" style="margin:0 0 10px">Tout ce qu’il faut savoir pour utiliser KYF Mobile, chapitre par chapitre. Touchez un titre pour le déplier.</p>`+GD.map(function(g,i){return `<details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"${i===0?" open":""}><summary>${g[0]}</summary>${g[1].map(function(t){return `<p class="hint" style="margin:8px 0 0">${t}</p>`}).join("")}</details>`}).join("");
  }else if(v==="reg_faq"){
    h+=regHead("Questions fréquentes","Réglages")+`<details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Mes données sont-elles envoyées quelque part ?</summary><p class="hint" style="margin:8px 0 0">Non. Elles sont chiffrées sur votre téléphone et KYF n’a aucun serveur qui les reçoit. Seuls le contact, la mise à jour de la liste de titres, la liaison avec KYF PC, la dictée vocale (faite par votre navigateur) et, si vous les activez, les statistiques anonymes utilisent le réseau.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>J’ai oublié ma phrase secrète.</summary><p class="hint" style="margin:8px 0 0">Elle ne peut pas être récupérée : KYF ne la connaît pas, c’est ce qui protège vos données. Si vous avez une sauvegarde et que vous vous souvenez de la phrase associée, vous pouvez la restaurer. Si vous aviez relié Google (KYF sur ordinateur), choisissez « Phrase oubliée ? » : vous créez une nouvelle phrase, vous vous reconnectez à Google et vos comptes, positions et courbe reviennent depuis KYF PC. Notez votre phrase dans un endroit sûr.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment changer de téléphone ?</summary><p class="hint" style="margin:8px 0 0">Sur l’ancien téléphone : Réglages, Sauvegarde du coffre, puis exportez le fichier. Sur le nouveau : installez KYF Mobile, puis restaurez ce fichier depuis le même écran. Si vous utilisez Google avec KYF sur ordinateur, vous pouvez aussi simplement vous reconnecter sur le nouveau téléphone.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment récupérer mes comptes depuis KYF sur ordinateur ?</summary><p class="hint" style="margin:8px 0 0">Réglages, Liaison avec KYF PC. Choisissez Google (recommandé) : vos comptes, positions, valeurs et la courbe arrivent, et vos opérations repartent vers KYF PC. Avec GitHub ou WebDAV, seuls les noms de vos comptes, personnes et contrats sont gardés, jamais de montants.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>À quoi sert « Mettre à jour la liste de titres » ?</summary><p class="hint" style="margin:8px 0 0">À télécharger la base publique des ETF, actions et fonds pour retrouver un titre par son nom ou son ISIN quand vous saisissez une opération.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>J’ai supprimé une opération par erreur.</summary><p class="hint" style="margin:8px 0 0">Réglages, Corbeille : une opération supprimée y reste restaurable 30 jours.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment mettre l’application à jour ?</summary><p class="hint" style="margin:8px 0 0">Tirez la page vers le bas depuis le haut de l’écran : la goutte se forme, relâchez, l’application cherche la dernière version et se recharge. Sinon, fermez puis rouvrez l’application.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Que contiennent les statistiques anonymes ?</summary><p class="hint" style="margin:8px 0 0">Une fois par jour au plus : un identifiant aléatoire, la version, le type d’appareil et la date. Jamais de données de votre coffre. Elles sont désactivées par défaut et se règlent dans Réglages, Application.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Pourquoi un message sur les dons ?</summary><p class="hint" style="margin:8px 0 0">KYF est gratuit, sans publicité, sans cookies et sans serveur. Je le développe seul : il vit grâce aux dons. Le message apparaît à la 5e ouverture, puis une fois par mois à la même date. « Plus tard » le ferme ; « Soutenir KYF » ouvre la page des dons (Ko-fi ou USDC), toujours facultatifs.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Je n’ai pas KYF sur ordinateur, par où commencer ?</summary><p class="hint" style="margin:8px 0 0">Choisissez « Je commence ici » à l’ouverture : indiquez votre prénom, si vous suivez votre patrimoine seul ou en famille, puis ouvrez votre premier compte (PEA, CTO, assurance vie…) et saisissez votre première opération.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Pourquoi installer l’appli avant de créer le coffre ?</summary><p class="hint" style="margin:8px 0 0">Une appli installée garde ses données à part du navigateur : un coffre créé dans le navigateur n’apparaît pas dans l’appli installée. Sur Samsung Internet, si Google Play Protect bloque l’installation, touchez le petit texte « Installer quand même », au-dessus du bouton OK.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Que montre « aujourd’hui » le week-end ou avant l’ouverture ?</summary><p class="hint" style="margin:8px 0 0">La variation du jour ne compte que les Bourses ouvertes aujourd’hui (heure de Paris) : actions et ETF européens dès 9 h, américains dès 15 h 30, jamais le week-end ni les jours fériés de la Bourse de Paris. La crypto, qui tourne 24 h/24, compte toujours. Les jours fériés américains ne sont pas gérés : ce jour-là, la variation affichée pour les titres américains peut être celle de la veille.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Pourquoi mon total diffère-t-il de KYF PC ?</summary><p class="hint" style="margin:8px 0 0">L’immobilier (biens et loyers) n’est pas ajouté au total du téléphone ; tout le reste l’est. Vous pouvez quand même en saisir les opérations ici.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment contacter l’éditeur ?</summary><p class="hint" style="margin:8px 0 0">Réglages, Application, Contact : bug, idée ou question. Vous pouvez écrire sans donner d’adresse e-mail, mais aucune réponse n’est alors possible.</p></details>`;
