    var GD=[
     ["1. Premiers pas",["KYF Mobile est le compagnon de KYF sur ordinateur : vous y saisissez vos opérations au fil de l’eau, puis vous les envoyez à KYF PC. Tout reste chiffré sur votre téléphone.","À la première ouverture, choisissez une <b>phrase secrète</b> (deux saisies identiques). Elle chiffre votre coffre ; KYF ne la connaît pas et ne peut pas la récupérer. Notez-la en lieu sûr.","Ensuite, l’appli se verrouille d’elle-même après quelques minutes. Vous la rouvrez avec la phrase, ou avec l’empreinte / le visage / une clé d’accès si vous l’avez activé (Réglages, Sécurité).","Pour l’avoir comme une vraie appli : installez-la sur l’écran d’accueil (Android : menu du navigateur, « Installer l’application » ; iPhone : Partager, « Sur l’écran d’accueil »)."]],
     ["2. Les 3 onglets",["<b>Accueil</b> : vos comptes et vos types de saisie, sous forme de tuiles.","<b>Paquets</b> : les opérations saisies, à envoyer à KYF PC (ou déjà envoyées).","<b>Réglages</b> : sécurité, liaison avec KYF PC, sauvegarde, affichage, aide."]],
     ["3. L’accueil",["En haut, « Nouvelle opération » : vous pouvez dicter, coller un texte ou écrire une phrase, l’appli prépare l’opération pour vous (le plus rapide).","Dessous, une tuile par type de compte ou d’actif (PEA, CTO, assurance vie, PER, livrets, crypto, SCPI, DCA, actifs…). Touchez une tuile pour saisir.","Réorganiser : maintenez une tuile et glissez-la dans son groupe. Le crayon renomme la tuile, le « − » la masque. « Rétablir l’accueil par défaut » remet tout comme au départ."]],
     ["4. Saisir une opération pas à pas",["Choisissez le compte (s’il y en a plusieurs), puis le type d’opération, puis, selon le cas, le titre, la date, la quantité ou le montant et les frais. Un indicateur « Étape x sur y » et le bouton retour (flèche en haut à gauche, ou geste retour du téléphone) vous guident.","Les montants se saisissent au pavé numérique intégré. « Plus d’options » (le petit triangle) ouvre les champs facultatifs : date, devise, valeur en euros, frais…","Un écran de confirmation récapitule l’opération avant l’enregistrement. Elle part ensuite dans Paquets, « À envoyer ».","Les frais de courtage sont repris de votre dernière opération sur le même compte pour gagner du temps."]],
     ["5. PEA, PEA-PME et CTO",["<b>Acheter / Vendre</b> : cherchez le titre par son nom, son ticker ou son ISIN (la liste se met à jour dans Réglages, Gestion, « Mettre à jour la liste de titres »), puis quantité, prix et frais.","<b>Dividende</b> : titre et montant perçu.","<b>Versement / Retrait</b> : espèces ajoutées ou retirées du compte. Ce sont les espèces du PEA ou du CTO ; les comptes courants se saisissent à part, dans Liquidités."]],
     ["6. Assurance vie et PER",["Choisissez d’abord le contrat. Types disponibles : <b>versement</b>, <b>versement programmé</b>, <b>rachat</b>, <b>arbitrage</b>, <b>frais</b>, <b>valeur du contrat</b>, <b>valeur d’une ligne</b> et <b>nouvelle ligne manuelle</b>.","Arbitrage : choisissez la ligne source, le montant (en € ou en % de la ligne), puis la ligne de destination, avec la quantité reçue et le prix si vous les connaissez.","Les lignes déjà connues du contrat (récupérées depuis KYF PC) sont proposées en liste ; « Autre ligne » permet d’en saisir une nouvelle. Les compartiments déductible / non déductible d’un PER sont regroupés."]],
     ["7. Livrets",["Dépôt, retrait, intérêts et virement entre livrets. Si vous avez plusieurs livrets, vous choisissez d’abord lequel ; avec un seul, l’appli passe directement à l’opération.","Un virement entre livrets est enregistré comme un retrait sur l’un et un dépôt sur l’autre."]],
     ["8. Crypto",["Achat, vente, échange (swap), transfert et frais de plateforme. Les cryptos populaires sont proposées avec leur icône ; vous pouvez en ajouter d’autres.","Transfert : même principe qu’une appli de portefeuille (adresse ou compte de destination, montant, frais de réseau)."]],
     ["9. SCPI",["Achat et vente de parts, dividende, mise à jour de valeur. Indiquez la <b>détention</b> : en direct, via une assurance vie, un PER ou une SCI.","En direct ou en SCI, vous pouvez aussi renseigner une nue-propriété (prix et durée)."]],
     ["10. Autres actifs et DCA",["Biens (immobilier, or, crowdfunding, véhicule…) : créez un nouvel actif puis mettez à jour sa valeur quand elle change.","Les versements programmés (DCA) se retrouvent sur leur tuile dédiée."]],
     ["11. Dicter, coller, scanner",["<b>Dictée vocale</b> : touchez le micro et dites par exemple « j’ai acheté 3 parts de … à 120 euros ». La reconnaissance est faite par votre navigateur ; elle demande l’appli hébergée en https. À défaut, utilisez le micro de votre clavier.","<b>Coller un texte</b> : collez un message ou un e-mail de confirmation, l’appli en extrait l’opération.","<b>Lire une capture d’écran</b> (essai) : choisissez une ou plusieurs images, la lecture est faite sur le téléphone. Vérifiez toujours le résultat avant d’enregistrer."]],
     ["12. Paquets : envoyer à KYF PC",["Onglets <b>À envoyer</b>, <b>Envoyées</b> et <b>Tout</b>. Une barre de recherche filtre par titre, compte ou date.","Pour envoyer : « Envoyer par QR codes » (présentez-les à la caméra de KYF sur ordinateur, dans n’importe quel ordre), « Copier le texte » ou « Partager le fichier ». KYF PC vérifie le tout à la réception.","Une fois KYF PC importé, il génère un <b>reçu</b> : chargez-le (fichier .kyfrecu, texte collé ou QR codes) pour que les opérations passent en « Envoyées ».","Une opération se supprime depuis sa fiche ; « Annuler » la restaure aussitôt, et la Corbeille la garde 30 jours."]],
     ["13. Liaison avec KYF PC",["Réglages, Liaison avec KYF PC : récupérez vos comptes, titres, personnes et biens depuis votre sauvegarde Google, GitHub ou WebDAV, ou par QR codes / texte collé depuis KYF PC (Réglages, Gestion).","Seuls les <b>noms</b> sont conservés, jamais les montants. « Données reçues de KYF » montre ce qui a été gardé."]],
     ["14. Famille et comptes",["Réglages, Gestion : « Ajouter un compte » (plusieurs PEA, CTO, assurances vie…) et « Famille » pour rattacher les opérations à vous, votre conjoint, vos enfants…"]],
     ["15. Sauvegarde et changement de téléphone",["Le coffre vit uniquement sur ce téléphone : réinstaller l’appli ou effacer les données du navigateur le supprime.","Réglages, Sauvegarde du coffre : exportez un fichier chiffré (seule votre phrase l’ouvre). Sur le nouveau téléphone, installez l’appli puis « Restaurer une sauvegarde » sur l’écran de création.","Réglages, Corbeille : les opérations supprimées y restent 30 jours."]],
     ["16. Sécurité",["Réglages, Sécurité : changer la phrase secrète (le coffre est re-chiffré), activer l’empreinte / le visage / une clé d’accès, et choisir le délai de verrouillage automatique.","« Rester déverrouillé à l’actualisation » évite de ressaisir la phrase quand la page se recharge pendant ce délai."]],
     ["17. Affichage et mise à jour",["Réglages, Affichage : thème clair, sombre ou automatique ; logos en ligne (désactivés : pastilles colorées, sans réseau).","Mise à jour : tirez la page vers le bas depuis le haut de l’écran (Accueil, Paquets, Réglages…), relâchez : l’appli cherche la dernière version. Si rien ne change, fermez-la complètement puis rouvrez-la.","Gestes : glissez un menu du bas vers le bas pour le fermer ; le geste retour du téléphone revient à l’écran précédent."]],
     ["18. Confidentialité, aide et contact",["Vos données ne quittent pas le téléphone. Le réseau n’est utilisé que pour le contact, la liste de titres, la liaison avec KYF PC, les logos, la dictée (navigateur) et, si vous les activez, les statistiques anonymes.","Une question ? Réglages, Questions fréquentes. Un bug ou une idée ? Réglages, Application, Contact."]]
    ];
    h+=regHead("Guide d’utilisation","Réglages")+`<p class="hint" style="margin:0 0 10px">Tout ce qu’il faut savoir pour utiliser KYF Mobile, chapitre par chapitre. Touchez un titre pour le déplier.</p>`+GD.map(function(g,i){return `<details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"${i===0?" open":""}><summary>${g[0]}</summary>${g[1].map(function(t){return `<p class="hint" style="margin:8px 0 0">${t}</p>`}).join("")}</details>`}).join("");
  }else if(v==="reg_faq"){
    h+=regHead("Questions fréquentes","Réglages")+`<details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Mes données sont-elles envoyées quelque part ?</summary><p class="hint" style="margin:8px 0 0">Non. Elles sont chiffrées sur votre téléphone et KYF n’a aucun serveur qui les reçoit. Seuls le contact, la mise à jour de la liste de titres, la liaison avec KYF PC, la dictée vocale (faite par votre navigateur) et, si vous les activez, les statistiques anonymes utilisent le réseau.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>J’ai oublié ma phrase secrète.</summary><p class="hint" style="margin:8px 0 0">Elle ne peut pas être récupérée : KYF ne la connaît pas, c’est ce qui protège vos données. Si vous avez une sauvegarde et que vous vous souvenez de la phrase associée, vous pouvez la restaurer. Notez votre phrase dans un endroit sûr.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment changer de téléphone ?</summary><p class="hint" style="margin:8px 0 0">Sur l’ancien téléphone : Réglages, Sauvegarde du coffre, puis exportez le fichier. Sur le nouveau : installez KYF Mobile, puis restaurez ce fichier depuis le même écran.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment récupérer mes comptes depuis KYF sur ordinateur ?</summary><p class="hint" style="margin:8px 0 0">Réglages, Liaison avec KYF PC. Choisissez Google, GitHub ou WebDAV, comme sur KYF PC. Seuls les noms de vos comptes, personnes et contrats sont gardés, jamais de montants.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>À quoi sert « Mettre à jour la liste de titres » ?</summary><p class="hint" style="margin:8px 0 0">À télécharger la base publique des ETF, actions et fonds pour retrouver un titre par son nom ou son ISIN quand vous saisissez une opération.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>J’ai supprimé une opération par erreur.</summary><p class="hint" style="margin:8px 0 0">Réglages, Corbeille : une opération supprimée y reste restaurable 30 jours.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment mettre l’application à jour ?</summary><p class="hint" style="margin:8px 0 0">Tirez la page vers le bas depuis le haut de l’écran : la goutte se forme, relâchez, l’application cherche la dernière version et se recharge. Sinon, fermez puis rouvrez l’application.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Que contiennent les statistiques anonymes ?</summary><p class="hint" style="margin:8px 0 0">Une fois par jour au plus : un identifiant aléatoire, la version, le type d’appareil et la date. Jamais de données de votre coffre. Elles sont désactivées par défaut et se règlent dans Réglages, Application.</p></details><details class="cd" style="margin-bottom:8px;padding:12px 14px;gap:0"><summary>Comment contacter l’éditeur ?</summary><p class="hint" style="margin:8px 0 0">Réglages, Application, Contact : bug, idée ou question. Vous pouvez écrire sans donner d’adresse e-mail, mais aucune réponse n’est alors possible.</p></details>`;
  }else if(v==="reg_quiz"){
